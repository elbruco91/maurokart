<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MauroKart</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/game.css" />
<link rel="stylesheet" href="css/setup.css" />
</head>
<body>

<section id="screen-menu" class="screen active">
  <div class="menu-box">
    <h1>MauroKart</h1>
    <p class="menu-subtitle">Fase 5 - setup pre-gara</p>
    <button id="start-race-btn" class="btn btn-primary btn-large">Inizia gara</button>
  </div>
</section>

<section id="screen-setup" class="screen">
  <div class="setup-box">
    <h1>Imposta la gara</h1>

    <div class="setup-section">
      <h2>Tracciato</h2>
      <div id="track-options" class="option-row"></div>
    </div>

    <div class="setup-section setup-inline">
      <div>
        <h2>Numero di giri</h2>
        <input id="laps-input" type="number" min="1" max="20" value="2" class="setup-input" />
      </div>
      <div>
        <h2>Numero giocatori</h2>
        <input id="player-count-input" type="number" min="2" max="8" value="4" class="setup-input" />
      </div>
    </div>

    <div class="setup-section">
      <h2>Ordine di partenza</h2>
      <div class="option-row">
        <button id="order-random-btn" class="btn btn-toggle">Casuale</button>
        <button id="order-manual-btn" class="btn btn-toggle">Manuale</button>
      </div>
    </div>

    <div class="setup-section">
      <h2>Giocatori</h2>
      <div id="player-rows"></div>
    </div>

    <div class="setup-actions">
      <button id="setup-cancel-btn" class="btn btn-outline">Annulla</button>
      <button id="setup-start-btn" class="btn btn-primary btn-large">Avvia gara</button>
    </div>
  </div>
</section>

<section id="screen-game" class="screen">
  <header class="game-header">
    <h1>MauroKart</h1>
    <div class="current-player">Turno di: <span id="current-player-label"></span></div>
    <button id="end-race-btn" class="btn btn-outline">Termina Gara</button>
    <button id="exit-btn" class="btn btn-outline">Esci / Pausa</button>
  </header>

  <main class="game-main">
    <div class="track-panel">
      <div id="track-container"></div>
    </div>

    <div class="side-panel">
      <div class="players-box">
        <h2>Giocatori</h2>
        <div id="player-list"></div>
      </div>

      <div class="controls-box">
        <div id="dice" class="dice">-</div>

        <button id="main-action-btn" class="btn btn-primary btn-large"></button>

        <div id="evaluate-row" class="evaluate-row">
          <button id="correct-btn" class="btn btn-success">Corretto</button>
          <button id="wrong-btn" class="btn btn-danger">Errato</button>
        </div>

        <div id="question-box" class="question-box">
          <p id="question-text" class="question-text"></p>
          <p id="answer-text" class="answer-text"></p>
          <button id="redraw-btn" class="btn btn-small">Ridisegna domanda</button>
        </div>

        <button id="loot-btn" class="btn btn-loot">Loot</button>

        <div class="manual-controls">
          <button id="advance-btn" class="btn btn-small">Avanti</button>
          <button id="retreat-btn" class="btn btn-small">Indietro</button>
          <button id="manual-adjust-btn" class="btn btn-small">Assegna/togli caselle</button>
        </div>
      </div>

      <div class="log-box">
        <h2>Storico turni</h2>
        <div id="log-container" class="log-container"></div>
      </div>
    </div>
  </main>
</section>

<div id="modal-root" class="modal-root"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
